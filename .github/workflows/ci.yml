name: CI

# Implements the pipeline gates from the Pre-Development Readiness Review §7.1–7.3:
# lint/typecheck -> unit+e2e tests -> SAST -> SCA/dependency audit -> secrets scan
# -> build -> container image scan. A failure at any gate blocks merge — see
# branch protection settings, which require this workflow green plus the review
# counts in CODEOWNERS before a PR can merge.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # pnpm's own version is intentionally NOT set here — pnpm/action-setup@v6
  # reads it from package.json's "packageManager" field (pnpm@9.15.9)
  # instead. Passing both a `version:` input here AND a packageManager
  # field is a hard conflict error in pnpm/action-setup v4+.
  NODE_VERSION: "20"

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test -- --coverage
      - uses: actions/upload-artifact@v6
        with:
          name: coverage-reports
          path: "**/coverage"
          retention-days: 14

  # Milestone 3.1 (Tenant/RLS Hardening) §1.3/§2.5 — before this job
  # existed, `pnpm run test:e2e` was never invoked anywhere in CI (no job
  # provisioned Postgres at all), so every RLS/tenant-isolation/
  # concurrency proof in this repo — including the entire General Ledger
  # concurrency suite and the new direct-RLS-proof/drift-guard tests —
  # had only ever been run manually. This job closes that gap: a real
  # Postgres 16 service, the same migration -> RLS -> constraints ->
  # app-role sequence used in dev, a hard gate that the app's own role
  # cannot bypass RLS, then the complete e2e suite across every package
  # that has one (db-core, identity, sphere-finance).
  test-e2e:
    name: End-to-end tests (Postgres 16)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: noryx
          POSTGRES_PASSWORD: noryx
          POSTGRES_DB: noryx_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U noryx"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # This job-level DATABASE_URL is the administrative/bootstrap role
      # (noryx) — matches every service's test/env-setup.ts default, and
      # is what the migration/setup steps below need: schema migrations,
      # RLS policy application, constraint application, and provisioning
      # noryx_app itself all require the role that owns the schema.
      #
      # It is deliberately NOT what the final `test:e2e` step below runs
      # under — that step overrides DATABASE_URL to APP_ROLE_DATABASE_URL
      # (noryx_app), the same override pattern the privilege-guard step
      # already used. Root cause this corrects: on the real postgres:16
      # service (POSTGRES_USER: noryx), noryx is the cluster's bootstrap
      # superuser, which unconditionally bypasses RLS. The application
      # under test, and this suite's own direct-DB verification queries
      # (e.g. general-ledger.e2e-spec.ts's no-mutation-side-effects
      # check, which is intentionally unscoped and relies entirely on RLS
      # to filter it), were running as that superuser — so RLS silently
      # did nothing for the one thing this whole job exists to prove.
      # Everything before this step keeps using the admin role above;
      # only the actual test run moves to the least-privilege role RLS
      # actually applies to.
      DATABASE_URL: postgresql://noryx:noryx@localhost:5432/noryx_test
      APP_ROLE_DATABASE_URL: postgresql://noryx_app:noryx_app@localhost:5432/noryx_test
      JWT_ACCESS_SECRET: test-only-secret-do-not-use-in-real-environments
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - name: Run migrations + RLS policies (db-core)
        run: pnpm --filter @noryx/db-core run migrate
      - name: Apply role-catalog DB constraint (db-core)
        run: pnpm run db:apply-db-constraints
      - name: Run migrations + RLS policies (sphere-finance)
        run: pnpm --filter @noryx/sphere-finance run migrate
      - name: Apply accounting-invariant DB constraints (sphere-finance)
        run: pnpm --filter @noryx/sphere-finance exec ts-node src/db/apply-db-constraints.ts
      - name: Provision the dedicated least-privilege app role (noryx_app)
        run: pnpm run db:apply-app-role
      - name: Guard — the app role must not bypass RLS (§1.1/§2.3)
        env:
          DATABASE_URL: ${{ env.APP_ROLE_DATABASE_URL }}
        run: pnpm run db:assert-role-privileges
      - name: Run the e2e suite as the least-privilege app role (noryx_app), not the admin role
        env:
          DATABASE_URL: ${{ env.APP_ROLE_DATABASE_URL }}
        run: pnpm run test:e2e

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/typescript p/owasp-top-ten p/nodejsscan

  sca:
    name: Dependency audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Patching SLA per Readiness Review §7.2: Critical 48h, High 7d, Medium 30d.
      # --audit-level=high fails the build on anything at or above High now;
      # Medium-severity findings are tracked, not build-blocking, per that SLA.
      - run: pnpm audit --audit-level=high

  # google/osv-scanner-action dropped its standalone step-level action —
  # OSV-Scanner is now only distributed as a reusable workflow, which
  # GitHub Actions requires to be called at the job level (a `uses:`
  # reusable-workflow call can't be one step among others in an existing
  # job). Split out of `sca` for that reason, not to change what it does:
  # same lockfile, same "fail the build on findings" behavior
  # (fail-on-vuln defaults to true), same defense-in-depth-beyond-`pnpm
  # audit` role.
  #
  # osv-scanner-reusable.yml's own osv-scan job declares
  # `permissions: { actions: read, contents: read, security-events:
  # write }` unconditionally at the job level (confirmed against the
  # workflow file at this exact ref) — GitHub Actions statically checks,
  # at workflow-parse time, that a caller grants everything a called
  # reusable workflow's jobs declare, regardless of what any `with:`
  # input is set to at runtime. Without this job explicitly granting
  # those three permissions, GitHub rejects the whole file as invalid
  # before it ever runs ("Invalid workflow file ... Error calling
  # workflow"), which is what surfaced after this job was first added.
  # Granting the permission does not itself upload anything — the actual
  # SARIF-upload step inside the reusable workflow only runs when
  # upload-sarif is true, which stays false below, so no new GitHub Code
  # Scanning integration is enabled by this. Scoped to this job only
  # (not a workflow-level `permissions:` block), so no other job's
  # default token permissions change.
  osv-scan:
    name: OSV dependency scan (defense in depth beyond npm's advisory DB)
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.5.1
    with:
      scan-args: |-
        --lockfile=./pnpm-lock.yaml
      upload-sarif: false

  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          quiet: true
          soft_fail: false

  build:
    name: Build all packages/services
    needs: [lint-typecheck, test, test-e2e, sast, sca, osv-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  docker-build-scan:
    name: Docker build + image scan (Trivy)
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, api-gateway, sphere-finance]
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t noryx/${{ matrix.service }}:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: noryx/${{ matrix.service }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Sign image (cosign, keyless via OIDC)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
      - name: Generate SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: noryx/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
      - uses: actions/upload-artifact@v6
        if: github.event_name == 'push'
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
