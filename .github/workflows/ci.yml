name: CI

# Implements the pipeline gates from the Pre-Development Readiness Review §7.1–7.3:
# lint/typecheck -> unit+e2e tests -> SAST -> SCA/dependency audit -> secrets scan
# -> build -> container image scan. A failure at any gate blocks merge — see
# branch protection settings, which require this workflow green plus the review
# counts in CODEOWNERS before a PR can merge.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"

jobs:
  secrets-scan:
    name: Secrets scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint-typecheck:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run typecheck

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test -- --coverage
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: "**/coverage"
          retention-days: 14

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: returntocorp/semgrep-action@v1
        with:
          config: p/typescript p/owasp-top-ten p/nodejsscan

  sca:
    name: Dependency audit (SCA)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      # Patching SLA per Readiness Review §7.2: Critical 48h, High 7d, Medium 30d.
      # --audit-level=high fails the build on anything at or above High now;
      # Medium-severity findings are tracked, not build-blocking, per that SLA.
      - run: pnpm audit --audit-level=high
      - name: OSV dependency scan (defense in depth beyond npm's advisory DB)
        uses: google/osv-scanner-action@v1
        with:
          scan-args: |-
            --lockfile=./pnpm-lock.yaml

  iac-scan:
    name: IaC scan (Checkov)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/
          quiet: true
          soft_fail: false

  build:
    name: Build all packages/services
    needs: [lint-typecheck, test, sast, sca]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: "pnpm" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build

  docker-build-scan:
    name: Docker build + image scan (Trivy)
    needs: [build]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [identity, api-gateway]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -f services/${{ matrix.service }}/Dockerfile -t noryx/${{ matrix.service }}:${{ github.sha }} .
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: noryx/${{ matrix.service }}:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"
      - name: Sign image (cosign, keyless via OIDC)
        if: github.event_name == 'push'
        uses: sigstore/cosign-installer@v3
      - name: Generate SBOM
        if: github.event_name == 'push'
        uses: anchore/sbom-action@v0
        with:
          image: noryx/${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
          output-file: sbom-${{ matrix.service }}.spdx.json
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
